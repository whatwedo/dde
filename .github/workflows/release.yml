name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: [ci]
    uses: ./.github/workflows/build.yml
    with:
      app-version-string: ${{ github.ref_name }}

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packages:
    name: Publish packages
    needs: [release]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish APT repo
        run: ./scripts/publish-apt.sh "${{ github.ref_name }}" dist packages.dde.sh stable
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload binaries to S3
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for bin in dist/dde-darwin-* dist/dde-linux-*; do
            [ -f "$bin" ] || continue
            aws s3 cp "$bin" "s3://packages.dde.sh/homebrew/${VERSION}/$(basename "$bin")"
          done

  alpine:
    name: Publish Alpine repo
    needs: [release]
    runs-on: ubuntu-latest
    # apk-tools 2.x so `apk index` emits the classic v2 APKINDEX, readable by
    # both apk-tools 2.x and 3.x clients.
    container: alpine:3.21
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Install dependencies
        run: apk add --no-cache bash abuild openssl aws-cli git

      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish Alpine repo
        run: |
          echo "${{ secrets.ALPINE_RSA_PRIVATE_KEY }}" > /tmp/alpine.rsa
          chmod 600 /tmp/alpine.rsa
          ./scripts/publish-alpine.sh "${{ github.ref_name }}" dist packages.dde.sh /tmp/alpine.rsa stable
          rm -f /tmp/alpine.rsa

  arch:
    name: Publish Arch repo
    needs: [release]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm --noprogressbar git aws-cli gnupg

      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish Arch repo
        run: ./scripts/publish-arch.sh "${{ github.ref_name }}" dist packages.dde.sh stable
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  rpm:
    name: Publish RPM repo
    needs: [release]
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Install dependencies
        run: dnf install -y git awscli2 gnupg2 rpm-build rpm-sign createrepo_c

      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish RPM repo
        run: ./scripts/publish-rpm.sh "${{ github.ref_name }}" dist packages.dde.sh stable
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  homebrew:
    name: Update Homebrew formula
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMEBREW_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "whatwedo/dde"
          git config --global user.email "dde@whatwedo.ch"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Update formula
        run: ./scripts/update-homebrew.sh "${{ github.ref_name }}" dist stable

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

  invalidate:
    name: Invalidate CloudFront cache
    needs: [packages, alpine, arch, rpm]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Create invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
