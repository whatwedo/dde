name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs: [ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-amd64
            runner: macos-15
            binary: dde-darwin-amd64
            micro_os: macos
            micro_arch: x86_64

          - name: darwin-arm64
            runner: macos-15
            binary: dde-darwin-arm64
            micro_os: macos
            micro_arch: aarch64

          - name: linux-amd64
            runner: ubuntu-latest
            binary: dde-linux-amd64
            micro_os: linux
            micro_arch: x86_64

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            binary: dde-linux-arm64
            micro_os: linux
            micro_arch: aarch64

    steps:
      - uses: actions/checkout@v6

      - name: Read PHP version
        id: php
        run: |
          FULL=$(grep '"php":' composer.json | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$FULL" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.minor }}
          extensions: yaml, mbstring, json, phar, pcntl, posix

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-no-dev-${{ hashFiles('composer.lock') }}
          restore-keys: composer-no-dev-

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress

      - name: Warm Symfony cache
        shell: bash
        run: |
          rm -rf var/cache/prod
          APP_ENV=prod php bin/console cache:warmup --env=prod

      - name: Download box.phar
        shell: bash
        run: |
          curl -fsSL https://github.com/box-project/box/releases/download/4.7.0/box.phar -o box.phar
          if [ ! -s box.phar ]; then
            echo "Error: box.phar download failed or file is empty"
            exit 1
          fi
          php box.phar --version || { echo "Error: box.phar is corrupt"; exit 1; }
          chmod +x box.phar

      - name: Build PHAR
        run: php box.phar compile

      - name: Download micro.sfx
        run: |
          MICRO_URL="https://dl.static-php.dev/static-php-cli/common/php-${{ steps.php.outputs.full }}-micro-${{ matrix.micro_os }}-${{ matrix.micro_arch }}.tar.gz"
          curl -fsSL "${MICRO_URL}" -o micro.tar.gz
          if [ ! -s micro.tar.gz ]; then
            echo "Error: micro.sfx download failed or file is empty"
            exit 1
          fi
          tar -xzf micro.tar.gz
          find . -maxdepth 2 -name 'micro.sfx' -exec mv {} micro.sfx \;
          test -f micro.sfx

      - name: Combine micro.sfx + PHAR
        run: |
          cat micro.sfx bin/dde.phar > ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packages:
    name: Publish packages
    needs: [release]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish APT repo
        run: ./scripts/publish-apt.sh "${{ github.ref_name }}" dist packages.dde.sh
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish Alpine repo
        run: |
          echo "${{ secrets.ALPINE_RSA_PRIVATE_KEY }}" > /tmp/alpine.rsa
          chmod 600 /tmp/alpine.rsa
          ./scripts/publish-alpine.sh "${{ github.ref_name }}" dist packages.dde.sh /tmp/alpine.rsa
          rm -f /tmp/alpine.rsa

      - name: Upload binaries to S3
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for bin in dist/dde-darwin-* dist/dde-linux-*; do
            [ -f "$bin" ] || continue
            aws s3 cp "$bin" "s3://packages.dde.sh/homebrew/${VERSION}/$(basename "$bin")"
          done

  arch:
    name: Publish Arch repo
    needs: [release]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm --noprogressbar git aws-cli gnupg

      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish Arch repo
        run: ./scripts/publish-arch.sh "${{ github.ref_name }}" dist packages.dde.sh
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  rpm:
    name: Publish RPM repo
    needs: [release]
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Install dependencies
        run: dnf install -y git awscli2 gnupg2 rpm-build rpm-sign createrepo_c

      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish RPM repo
        run: ./scripts/publish-rpm.sh "${{ github.ref_name }}" dist packages.dde.sh
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  homebrew:
    name: Update Homebrew formula
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMEBREW_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "whatwedo/dde"
          git config --global user.email "dde@whatwedo.ch"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Update formula
        run: ./scripts/update-homebrew.sh "${{ github.ref_name }}" dist

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
