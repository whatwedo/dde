name: Nightly

on:
  push:
    branches:
      - main

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  meta:
    name: Compute nightly metadata
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      pkg_version: ${{ steps.meta.outputs.pkg_version }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve short SHA and timestamp
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date -u +%Y%m%d.%H%M)
          EPOCH=$(git log -1 --format=%ct)
          echo "app_version=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${TS}" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "Nightly app_version=${SHA} pkg_version=${TS} SOURCE_DATE_EPOCH=${EPOCH}"

  build:
    name: Build
    needs: [meta]
    uses: ./.github/workflows/build.yml
    with:
      app-version-string: ${{ needs.meta.outputs.app_version }}

  packages:
    name: Publish packages (nightly)
    needs: [build, meta]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish APT repo (nightly)
        run: ./scripts/publish-apt.sh "${{ needs.meta.outputs.pkg_version }}" dist packages.dde.sh nightly
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}

      - name: Upload binaries to S3 (nightly)
        run: |
          VERSION="${{ needs.meta.outputs.pkg_version }}"
          for bin in dist/dde-darwin-* dist/dde-linux-*; do
            [ -f "$bin" ] || continue
            aws s3 cp "$bin" "s3://packages.dde.sh/homebrew-nightly/${VERSION}/$(basename "$bin")"
          done

  alpine:
    name: Publish Alpine repo (nightly)
    needs: [build, meta]
    runs-on: ubuntu-latest
    # apk-tools 2.x so `apk index` emits the classic v2 APKINDEX, readable by
    # both apk-tools 2.x and 3.x clients.
    container: alpine:3.24
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-2
    steps:
      - name: Install dependencies
        run: apk add --no-cache bash abuild openssl aws-cli git

      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish Alpine repo (nightly)
        env:
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}
        run: |
          echo "${{ secrets.ALPINE_RSA_PRIVATE_KEY }}" > /tmp/alpine.rsa
          chmod 600 /tmp/alpine.rsa
          ./scripts/publish-alpine.sh "${{ needs.meta.outputs.pkg_version }}" dist packages.dde.sh /tmp/alpine.rsa nightly
          rm -f /tmp/alpine.rsa

  arch:
    name: Publish Arch repo (nightly)
    needs: [build, meta]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm --noprogressbar git aws-cli gnupg

      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish Arch repo (nightly)
        run: ./scripts/publish-arch.sh "${{ needs.meta.outputs.pkg_version }}" dist packages.dde.sh nightly
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}

  rpm:
    name: Publish RPM repo (nightly)
    needs: [build, meta]
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Install dependencies
        run: dnf install -y git awscli2 gnupg2 rpm-build rpm-sign createrepo_c

      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish RPM repo (nightly)
        run: ./scripts/publish-rpm.sh "${{ needs.meta.outputs.pkg_version }}" dist packages.dde.sh nightly
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}

  homebrew:
    name: Update Homebrew formula (nightly)
    needs: [packages, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMEBREW_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "whatwedo/dde"
          git config --global user.email "dde@whatwedo.ch"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Update formula
        run: ./scripts/update-homebrew.sh "${{ needs.meta.outputs.pkg_version }}" dist nightly

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

  invalidate:
    name: Invalidate CloudFront cache (nightly)
    needs: [packages, alpine, arch, rpm]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Create invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
